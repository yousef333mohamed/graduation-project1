<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AGRAi — Agricultural Advisory Chatbot</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=DM+Mono:wght@300;400;500&family=DM+Sans:wght@300;400;500&family=Cairo:wght@300;400;500;700&display=swap');

  :root {
    --bg:        #0d1a0f;
    --bg2:       #111f13;
    --bg3:       #162019;
    --border:    #1e3322;
    --green:     #4ade80;
    --green-dim: #22543d;
    --green-glow:#4ade8033;
    --amber:     #fbbf24;
    --text:      #e2f0e6;
    --text-dim:  #6b8f72;
    --user-bg:   #1a2e1d;
    --bot-bg:    #0f1f11;
  }

  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Cairo', 'DM Sans', sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    direction: rtl;
    text-align: right;
  }

  /* ── Background texture ── */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 80% 50% at 20% 80%, #052e1633 0%, transparent 60%),
      radial-gradient(ellipse 60% 40% at 80% 20%, #0a3d1a22 0%, transparent 60%);
    pointer-events: none;
    z-index: 0;
  }

  /* ── Header ── */
  header {
    position: relative;
    z-index: 10;
    padding: 16px 28px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 14px;
    background: var(--bg2);
    backdrop-filter: blur(10px);
  }

  .logo {
    width: 38px;
    height: 38px;
    border-radius: 10px;
    background: linear-gradient(135deg, #166534, #4ade80);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
  }

  .header-text h1 {
    font-family: 'Playfair Display', serif;
    font-size: 18px;
    color: var(--green);
    letter-spacing: 0.5px;
  }

  .header-text p {
    font-size: 11px;
    color: var(--text-dim);
    font-family: 'DM Mono', monospace;
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  .status {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    color: var(--text-dim);
    font-family: 'DM Mono', monospace;
  }

  .status-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--green);
    box-shadow: 0 0 8px var(--green);
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  /* ── Chat area ── */
  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 24px 0;
    position: relative;
    z-index: 1;
    scroll-behavior: smooth;
  }

  #chat::-webkit-scrollbar { width: 4px; }
  #chat::-webkit-scrollbar-track { background: transparent; }
  #chat::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

  .msg-wrap {
    display: flex;
    padding: 6px 28px;
    gap: 12px;
    animation: fadeUp 0.3s ease;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .msg-wrap.user { flex-direction: row; }

  .avatar {
    width: 32px;
    height: 32px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
    flex-shrink: 0;
    margin-top: 2px;
  }

  .avatar.bot { background: linear-gradient(135deg, #166534, #4ade80); }
  .avatar.user { background: var(--bg3); border: 1px solid var(--border); }

  .bubble {
    max-width: 72%;
    padding: 12px 16px;
    border-radius: 14px;
    font-size: 14px;
    line-height: 1.6;
    position: relative;
    unicode-bidi: plaintext;
    text-align: start;
  }

  .bubble.bot {
    background: var(--bot-bg);
    border: 1px solid var(--border);
    border-top-right-radius: 4px;
    color: var(--text);
  }

  .bubble.user {
    background: var(--user-bg);
    border: 1px solid var(--green-dim);
    border-top-left-radius: 4px;
    color: var(--text);
  }

  /* Result cards inside bubble */
  .result-card {
    margin-top: 12px;
    padding: 12px 14px;
    background: #0a1a0c;
    border: 1px solid var(--border);
    border-left: 3px solid var(--green);
    border-radius: 8px;
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    line-height: 1.8;
  }

  .result-card .label {
    color: var(--green);
    font-weight: 500;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 6px;
  }

  .result-card .value {
    color: var(--text);
    font-size: 13px;
  }

  .warn-card {
    margin-top: 10px;
    padding: 10px 12px;
    background: #1a1200;
    border: 1px solid #3d2e00;
    border-left: 3px solid var(--amber);
    border-radius: 8px;
    font-size: 12px;
    color: var(--amber);
    font-family: 'DM Mono', monospace;
  }

  /* Typing indicator */
  .typing {
    display: flex;
    gap: 4px;
    padding: 6px 4px;
    align-items: center;
  }

  .typing span {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--green);
    animation: bounce 1.2s infinite;
  }

  .typing span:nth-child(2) { animation-delay: 0.2s; }
  .typing span:nth-child(3) { animation-delay: 0.4s; }

  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
    30% { transform: translateY(-6px); opacity: 1; }
  }

  /* ── Input area ── */
  footer {
    position: relative;
    z-index: 10;
    padding: 16px 28px;
    border-top: 1px solid var(--border);
    background: var(--bg2);
  }

  .input-wrap {
    display: flex;
    gap: 10px;
    align-items: flex-end;
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 10px 14px;
    transition: border-color 0.2s;
  }

  .input-wrap:focus-within {
    border-color: var(--green-dim);
    box-shadow: 0 0 0 3px var(--green-glow);
  }

  #input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: var(--text);
    font-size: 14px;
    font-family: 'Cairo', 'DM Sans', sans-serif;
    resize: none;
    max-height: 100px;
    line-height: 1.5;
    direction: rtl;
    text-align: right;
  }

  #input::placeholder { color: var(--text-dim); }

  #send {
    width: 34px;
    height: 34px;
    border-radius: 8px;
    background: var(--green);
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: all 0.2s;
    color: #0d1a0f;
  }

  #send:hover { background: #86efac; transform: scale(1.05); }
  #send:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

  .hint {
    font-size: 11px;
    color: var(--text-dim);
    margin-top: 8px;
    text-align: center;
    font-family: 'DM Mono', monospace;
  }

  /* Suggestions */
  .suggestions {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 10px;
  }

  .suggestion {
    padding: 6px 12px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: var(--bg3);
    color: var(--text-dim);
    font-size: 12px;
    cursor: pointer;
    transition: all 0.2s;
    font-family: 'DM Mono', monospace;
  }

  .suggestion:hover {
    border-color: var(--green-dim);
    color: var(--green);
  }
</style>
</head>
<body>

<header>
  <div class="logo">🌱</div>
  <div class="header-text">
    <h1>AGRAi</h1>
    <p>Agricultural Advisory System</p>
  </div>
  <div class="status">
    <div class="status-dot"></div>
    Online
  </div>
</header>

<div id="chat"></div>

<footer>
  <div class="suggestions" id="suggestions">
    <div class="suggestion" onclick="useSuggestion(this)">عندي أرض وعايز أعرف أزرع إيه</div>
    <div class="suggestion" onclick="useSuggestion(this)">ما هو أفضل سماد للأرز؟</div>
    <div class="suggestion" onclick="useSuggestion(this)">كيف أحسن تربتي؟</div>
  </div>
  <div class="input-wrap">
    <textarea id="input" rows="1" placeholder="اكتب رسالتك هنا..."></textarea>
    <button id="send" onclick="sendMessage()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <line x1="22" y1="2" x2="11" y2="13"></line>
        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
      </svg>
    </button>
  </div>
  <div class="hint">Press Enter to send · Shift+Enter for new line</div>
</footer>

<script>
const SYSTEM_PROMPT = `You are AGRAi, a bilingual agricultural advisory assistant (Arabic and English).

LANGUAGE RULES - CRITICAL - MUST FOLLOW:
- If the user writes in Arabic: respond ENTIRELY in Arabic. Zero English words except N, P, K, pH, NPK.
- If the user writes in English: respond ENTIRELY in English.
- STRICTLY FORBIDDEN: Chinese characters, Japanese, Korean, or ANY non-Arabic/English text
- STRICTLY FORBIDDEN: Strange symbols like 许多, 能够, or any Asian characters
- If you feel like writing a non-Arabic/English word, write it in Arabic instead
- Arabic numbers are fine: ١٢٣ or 123 both work
- Technical terms only in English: N, P, K, pH, NPK, DAP, Urea, MOP, SSP

You have access to an ML model that predicts:
1. The best crop based on soil NPK, temperature, humidity, pH, and rainfall
2. The best fertilizer based on soil type, crop type, growth stage, season, and more

YOUR BEHAVIOR:
- Greet warmly in the user's language
- When the user asks about crops or fertilizers, collect their field data conversationally
- Ask for missing information naturally, one or two questions at a time
- When you have enough data, call the ML model by outputting a special JSON block
- Present results clearly in the user's language
- Never hallucinate numbers — only use results from the ML model

REQUIRED DATA for crop recommendation:
- N (Nitrogen), P (Phosphorus), K (Potassium) — soil levels
- Temperature (C), Humidity (%), pH, Rainfall (mm)
- Area in feddan

REQUIRED DATA for fertilizer recommendation:
- Soil type (Clay/Silt/Sandy/Loamy)
- Crop type, Growth stage, Season
- Irrigation type, Previous crop, Region
- Soil moisture, Organic carbon, Electrical conductivity
- Fertilizer used last season, Yield last season

When you have enough data for crop recommendation, output EXACTLY this JSON block:
[CALL_CROP_MODEL]{"N":90,"P":42,"K":43,"temperature":21,"humidity":82,"ph":6.5,"rainfall":203,"area_feddan":5}[/CALL_CROP_MODEL]

When you have enough data for fertilizer recommendation, output EXACTLY this JSON block:
[CALL_FERT_MODEL]{"soil_type":"Clay","crop_type":"Rice","growth_stage":"Vegetative","season":"Kharif","irrigation_type":"Canal","previous_crop":"Wheat","region":"South","soil_ph":6.5,"soil_moisture":35,"organic_carbon":0.8,"electrical_conductivity":1.2,"nitrogen":60,"phosphorus":35,"potassium":30,"temperature":21,"humidity":82,"rainfall":203,"fertilizer_used_last_season":150,"yield_last_season":3.5}[/CALL_FERT_MODEL]

If the user does not know some values, use reasonable defaults and mention it.
Always be helpful, warm, and professional.`;

// ── Groq API Key ──
const GROQ_API_KEY = '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';

let messages = [];
let isLoading = false;
let collectedData = {};

// ── Render message ──
function addMessage(role, content, extraHTML = '') {
  const chat = document.getElementById('chat');
  const wrap = document.createElement('div');
  wrap.className = `msg-wrap ${role}`;

  const avatar = document.createElement('div');
  avatar.className = `avatar ${role}`;
  avatar.textContent = role === 'bot' ? '🌱' : '👤';

  const bubble = document.createElement('div');
  bubble.className = `bubble ${role}`;
  bubble.innerHTML = content.replace(/\n/g, '<br>') + extraHTML;

  wrap.appendChild(avatar);
  wrap.appendChild(bubble);
  chat.appendChild(wrap);
  chat.scrollTop = chat.scrollHeight;
  return bubble;
}

// ── Typing indicator ──
function showTyping() {
  const chat = document.getElementById('chat');
  const wrap = document.createElement('div');
  wrap.className = 'msg-wrap bot';
  wrap.id = 'typing-indicator';

  const avatar = document.createElement('div');
  avatar.className = 'avatar bot';
  avatar.textContent = '🌱';

  const bubble = document.createElement('div');
  bubble.className = 'bubble bot';
  bubble.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';

  wrap.appendChild(avatar);
  wrap.appendChild(bubble);
  chat.appendChild(wrap);
  chat.scrollTop = chat.scrollHeight;
}

function hideTyping() {
  const el = document.getElementById('typing-indicator');
  if (el) el.remove();
}

// ── Call ML Model (simulated — replace with real API) ──
async function callCropModel(data) {
  // Simulate ML model response
  // In production, call your FastAPI endpoint:
  // const res = await fetch('http://localhost:8000/recommend/crop', {
  //   method: 'POST',
  //   headers: {'Content-Type': 'application/json'},
  //   body: JSON.stringify(data)
  // });
  // return await res.json();

  return {
    recommended_crop: "rice",
    confidence: "93.5%",
    uncertain: false,
    top3_crops: [
      {crop: "rice", confidence: "93.5%"},
      {crop: "jute", confidence: "6.5%"},
      {crop: "maize", confidence: "0.0%"}
    ],
    npk_status: {
      nitrogen:   {current: data.N, target: 80, status: data.N < 78 ? `Deficit (${data.N-80})` : "Ideal"},
      phosphorus: {current: data.P, target: 47, status: data.P < 45 ? `Deficit (${data.P-47})` : "Ideal"},
      potassium:  {current: data.K, target: 40, status: data.K < 38 ? `Deficit (${data.K-40})` : "Ideal"},
    },
    warnings: data.rainfall > 150 ? ["High rainfall detected → delay nitrogen application"] : [],
    area_feddan: data.area_feddan,
    area_hectare: (data.area_feddan * 0.42).toFixed(2)
  };
}

async function callFertModel(data) {
  return {
    recommended_fertilizer: "DAP",
    confidence: "88.5%",
    confidence_label: "High",
    description: "Diammonium Phosphate (18% N, 46% P)",
    best_used_for: "N and P deficiency",
    top3_fertilizers: [
      {fertilizer: "DAP",  confidence: "88.5%"},
      {fertilizer: "Urea", confidence: "6.0%"},
      {fertilizer: "MOP",  confidence: "5.5%"}
    ],
    supplementary: [{fertilizer: "Urea", reason: "for additional nitrogen correction"}],
    weather_warning: data.rainfall > 150 ? "Avoid applying DAP before heavy rainfall" : null
  };
}

// ── Icon helpers ──
const CROP_ICONS = {
  rice:'🌾', maize:'🌽', cotton:'🌿', jute:'🌿', banana:'🍌',
  mango:'🥭', grapes:'🍇', apple:'🍎', orange:'🍊', papaya:'🍈',
  coconut:'🥥', coffee:'☕', watermelon:'🍉', muskmelon:'🍈',
  pomegranate:'🍎', lentil:'🫘', chickpea:'🫘', mungbean:'🫘',
  blackgram:'🫘', kidneybeans:'🫘', pigeonpeas:'🫘', mothbeans:'🫘',
};
const FERT_ICONS = {
  'DAP':'🧪', 'Urea':'💊', 'MOP':'⚗️', 'NPK':'🔬',
  'SSP':'🧫', 'Compost':'🌱', 'Zinc Sulphate':'💎',
};
const STATUS_ICONS = {
  'Ideal':'✅', 'Excess':'🔴', 'Deficit':'🟡',
};

function statusIcon(status) {
  if (status.includes('Excess')) return '🔴';
  if (status.includes('Deficit')) return '🟡';
  return '✅';
}

// ── Build result HTML ──
function buildCropResultHTML(result) {
  const cropIcon = CROP_ICONS[result.recommended_crop.toLowerCase()] || '🌱';

  const top3 = result.top3_crops.map((c, i) => {
    const icon = CROP_ICONS[c.crop.toLowerCase()] || '🌱';
    const medal = i === 0 ? '🥇' : i === 1 ? '🥈' : '🥉';
    return `${medal} ${icon} ${c.crop.padEnd(12)} ${c.confidence}`;
  }).join('\n');

  const npk = Object.entries(result.npk_status).map(([k, v]) => {
    const icon = statusIcon(v.status);
    const label = k === 'nitrogen' ? '🟩 N' : k === 'phosphorus' ? '🟦 P' : '🟨 K';
    return `${icon} ${label}  Current: ${v.current}  Target: ${v.target}  ${v.status}`;
  }).join('\n');

  let html = `
    <div class="result-card">
      <div class="label">🌾 المحصول الموصى به / Recommended Crop</div>
      <div class="value" style="font-size:16px">${cropIcon} <strong>${result.recommended_crop.toUpperCase()}</strong></div>
      <div class="value" style="color:var(--text-dim);font-size:12px;margin-top:4px">🎯 Confidence: ${result.confidence}</div>
    </div>
    <div class="result-card">
      <div class="label">📊 أفضل 3 محاصيل / Top 3 Crops</div>
      <div class="value"><pre style="font-family:inherit;line-height:2">${top3}</pre></div>
    </div>
    <div class="result-card">
      <div class="label">🧪 حالة NPK / NPK Status</div>
      <div class="value"><pre style="font-family:inherit;font-size:12px;line-height:2">${npk}</pre></div>
    </div>
    <div class="result-card">
      <div class="label">📐 المساحة / Field Size</div>
      <div class="value">🌍 ${result.area_feddan} فدان = ${result.area_hectare} hectare</div>
    </div>`;

  if (result.warnings && result.warnings.length > 0) {
    result.warnings.forEach(w => {
      html += `<div class="warn-card">⚠️ ${w}</div>`;
    });
  }

  return html;
}

function buildFertResultHTML(result) {
  const fertIcon = FERT_ICONS[result.recommended_fertilizer] || '🧪';
  const confIcon = result.confidence_label === 'High' ? '🟢' : result.confidence_label === 'Moderate' ? '🟡' : '🔴';

  const top3 = result.top3_fertilizers.map((f, i) => {
    const icon = FERT_ICONS[f.fertilizer] || '🧪';
    const medal = i === 0 ? '🥇' : i === 1 ? '🥈' : '🥉';
    return `${medal} ${icon} ${f.fertilizer.padEnd(15)} ${f.confidence}`;
  }).join('\n');

  let html = `
    <div class="result-card">
      <div class="label">🧪 السماد الموصى به / Recommended Fertilizer</div>
      <div class="value" style="font-size:16px">${fertIcon} <strong>${result.recommended_fertilizer}</strong></div>
      <div class="value" style="color:var(--text-dim);font-size:12px;margin-top:4px">${confIcon} Confidence: ${result.confidence} (${result.confidence_label})</div>
      <div class="value" style="color:var(--text-dim);font-size:12px;margin-top:4px">📋 ${result.description}</div>
      <div class="value" style="color:var(--text-dim);font-size:12px;margin-top:4px">🎯 ${result.best_used_for}</div>
    </div>`;

  if (result.supplementary && result.supplementary.length > 0) {
    const supps = result.supplementary.map(s => {
      const icon = FERT_ICONS[s.fertilizer] || '🧪';
      return `  ➕ ${icon} ${s.fertilizer} — ${s.reason}`;
    }).join('\n');
    html += `<div class="result-card">
      <div class="label">➕ أسمدة تكميلية / Supplementary</div>
      <div class="value"><pre style="font-family:inherit;font-size:12px;line-height:2">${supps}</pre></div>
    </div>`;
  }

  html += `<div class="result-card">
    <div class="label">📊 أفضل 3 أسمدة / Top 3 Fertilizers</div>
    <div class="value"><pre style="font-family:inherit;line-height:2">${top3}</pre></div>
  </div>`;

  if (result.weather_warning) {
    html += `<div class="warn-card">🌧️ ${result.weather_warning}</div>`;
  }

  return html;
}

// ── Send message ──
async function sendMessage() {
  const input = document.getElementById('input');
  const text  = input.value.trim();
  if (!text || isLoading) return;

  // Hide suggestions
  document.getElementById('suggestions').style.display = 'none';

  input.value = '';
  input.style.height = 'auto';
  isLoading = true;
  document.getElementById('send').disabled = true;

  // Add user message
  addMessage('user', text);
  messages.push({role: 'user', content: text});

  // Show typing
  showTyping();

  try {
    const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${GROQ_API_KEY}`
      },
      body: JSON.stringify({
        model: 'llama3-70b-8192',
        max_tokens: 1000,
        messages: [
          {role: 'system', content: SYSTEM_PROMPT},
          ...messages
        ]
      })
    });

    const data = await response.json();
    hideTyping();

    let reply = data.choices[0].message.content;

    // ── Check for model calls ──
    let extraHTML = '';

    const cropMatch = reply.match(/\[CALL_CROP_MODEL\](.*?)\[\/CALL_CROP_MODEL\]/s);
    if (cropMatch) {
      const params = JSON.parse(cropMatch[1]);
      const result = await callCropModel(params);
      extraHTML += buildCropResultHTML(result);
      reply = reply.replace(cropMatch[0], '').trim();

      // Add result to context
      messages.push({role: 'assistant', content: reply || 'Here are your crop results:'});
      messages.push({role: 'user', content: `[CROP_MODEL_RESULT]: ${JSON.stringify(result)}`});
    }

    const fertMatch = reply.match(/\[CALL_FERT_MODEL\](.*?)\[\/CALL_FERT_MODEL\]/s);
    if (fertMatch) {
      const params = JSON.parse(fertMatch[1]);
      const result = await callFertModel(params);
      extraHTML += buildFertResultHTML(result);
      reply = reply.replace(fertMatch[0], '').trim();

      messages.push({role: 'assistant', content: reply || 'Here are your fertilizer results:'});
      messages.push({role: 'user', content: `[FERT_MODEL_RESULT]: ${JSON.stringify(result)}`});
    } else {
      messages.push({role: 'assistant', content: reply});
    }

    if (reply) {
      addMessage('bot', reply, extraHTML);
    } else if (extraHTML) {
      addMessage('bot', 'Based on your data, here are the results:', extraHTML);
    }

  } catch (err) {
    hideTyping();
    addMessage('bot', '❌ Connection error. Please try again.');
    console.error(err);
  }

  isLoading = false;
  document.getElementById('send').disabled = false;
  input.focus();
}

function useSuggestion(el) {
  document.getElementById('input').value = el.textContent;
  sendMessage();
}

// ── Input auto-resize & Enter key ──
const inputEl = document.getElementById('input');
inputEl.addEventListener('input', () => {
  inputEl.style.height = 'auto';
  inputEl.style.height = inputEl.scrollHeight + 'px';
});

inputEl.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});

// ── Initial greeting ──
window.addEventListener('load', async () => {
  showTyping();
  await new Promise(r => setTimeout(r, 800));
  hideTyping();

  const greeting = `أهلاً وسهلاً! 👋 أنا AGRAi، مساعدك الزراعي الذكي.

أقدر أساعدك في:
• 🌾 تحديد أفضل محصول لأرضك
• 🧪 توصية السماد المناسب بالكميات
• 📅 خطة التسميد على مراحل

إيه اللي تحتاج مساعدة فيه النهارده؟`;

  addMessage('bot', greeting);
  messages.push({role: 'assistant', content: greeting});
});
</script>
